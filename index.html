:root{
  --velvet:#2A1630;--velvet-2:#361D3E;--velvet-3:#4A2A53;
  --bone:#F3E8D8;--bone-2:#CDBDAE;--brass:#D9A441;
  --bg:var(--velvet);--surface:var(--velvet-2);--ink:var(--bone);--ink-2:var(--bone-2);--accent:var(--brass);--on-accent:#2A1630;
  --line:rgba(243,232,216,.16);
  --line:color-mix(in srgb,var(--ink) 17%,transparent);
  --wash:color-mix(in srgb,var(--ink) 8%,transparent);
  --scrim:color-mix(in srgb,var(--bg) 90%,transparent);
  --display:"Grenze Gotisch","Iowan Old Style",Georgia,serif;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --wrap:1240px;--gut:clamp(16px,4vw,40px);--hdr:72px;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr) + 16px);transition:background-color .6s ease}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;transition:background-color .6s ease,color .6s ease;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1;letter-spacing:-.005em;margin:0;text-wrap:balance}
p{margin:0 0 1em;text-wrap:pretty}
.wrap{width:100%;max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:6px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
main{display:block;outline:none;min-height:60vh}
svg.i{width:20px;height:20px;flex:none}

/* announcement + header */
.announce{background:var(--accent);color:var(--on-accent);text-align:center;font-weight:700;font-size:14.5px;padding:8px var(--gut);transition:background-color .6s,color .6s}
.hdr{position:sticky;top:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background-color .6s}
.nav{display:flex;align-items:center;gap:6px;height:var(--hdr)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:33px;line-height:1;margin-right:18px;padding-block:6px}
.brand svg{width:17px;height:30px;color:var(--accent);flex:none}
.menu{display:flex;align-items:center;gap:2px;margin:0;padding:0;list-style:none}
.menu>li{position:relative}
.mbtn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 13px;border:0;background:none;border-radius:8px;font-weight:700;font-size:15.5px;text-decoration:none;white-space:nowrap}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--wash)}
.mbtn.cur{box-shadow:inset 0 -2px 0 var(--accent);border-radius:8px 8px 0 0}
.mbtn svg{width:10px;height:10px;transition:transform .2s}
.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:0;background:none;border-radius:8px;font-weight:700;font-size:15px;text-decoration:none}
.ibtn:hover{background:var(--wash)}
.bagn{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12.5px;line-height:22px;text-align:center}
.burger{display:none;margin-left:-10px}
@media (max-width:1060px){.menu{display:none}.burger{display:inline-flex}.brand{font-size:29px;margin-right:0}}
@media (max-width:520px){.ibtn .lbl{display:none}.brand svg{display:none}}

.panel{position:absolute;top:calc(100% + 8px);left:0;z-index:70;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);padding:16px;display:none}
.menu>li.open>.panel{display:block}
.panel-shop{width:640px;grid-template-columns:1fr 230px;gap:18px}
.menu>li.open>.panel-shop{display:grid}
.plist{list-style:none;margin:0;padding:0}
.plist a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:700}
.plist a:hover{background:var(--wash)}
.plist small{color:var(--ink-2);font-weight:400;font-size:14px}
.plist .all{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.pfeat{position:relative;display:block;border-radius:8px;overflow:hidden;min-height:260px;text-decoration:none;background:var(--bg)}
.pfeat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pfeat span{position:absolute;left:0;right:0;bottom:0;padding:48px 14px 14px;background:linear-gradient(transparent,rgba(20,8,24,.88));color:#F3E8D8;font-weight:700;font-size:14.5px;line-height:1.35}
.panel-cw{width:660px;grid-template-columns:repeat(3,1fr);gap:2px}
.menu>li.open>.panel-cw{display:grid}
.cwlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:700;font-size:15px}
.cwlink:hover{background:var(--wash)}
.cwlink small{margin-left:auto;color:var(--ink-2);font-weight:400;font-size:13.5px}
.cwlink.all{grid-column:1/-1;border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:6px}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;background:var(--c);box-shadow:inset 0 0 0 3px var(--a),0 0 0 1px var(--line)}
.panel-about{width:250px}
.panel-about a{display:block;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:700}
.panel-about a:hover{background:var(--wash)}

/* mobile nav */
.mnav{position:fixed;inset:0;z-index:95;background:var(--bg);overflow-y:auto;padding:12px var(--gut) 48px;transform:translateX(-100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s linear .35s}
.mnav.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.7,.2,1),visibility 0s}
.mnav-top{display:flex;justify-content:space-between;align-items:center;height:56px;margin-bottom:6px}
.mnav details{border-bottom:1px solid var(--line)}
.mnav summary,.mnav .mtop{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:var(--display);font-size:32px;line-height:1.1;cursor:pointer;text-decoration:none}
.mnav summary::-webkit-details-marker{display:none}
.mnav .mtop{border-bottom:1px solid var(--line)}
.mlinks{padding:0 0 14px}
.mlinks a{display:flex;align-items:center;gap:12px;padding:9px 0;text-decoration:none;font-weight:700}

/* buttons + links */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:8px;border:2px solid transparent;font-weight:700;font-size:16px;text-decoration:none;line-height:1.1;text-align:center}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{border-color:color-mix(in srgb,var(--ink) 45%,transparent);background:transparent}
.btn-g:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.tlink{font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.tlink:hover{text-decoration-color:var(--ink)}

/* hero */
.hero{padding:clamp(36px,6vw,84px) 0 clamp(56px,7vw,96px)}
.hero-g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(66px,9.4vw,136px);line-height:.84;font-weight:600}
.lede{font-size:clamp(18px,1.5vw,20px);color:var(--ink-2);max-width:34ch;margin:28px 0 34px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mosaic figure{margin:0;border-radius:4px;overflow:hidden;background:var(--surface)}
.mosaic .m1{grid-column:1/-1;aspect-ratio:16/10}
.mosaic .m2,.mosaic .m3{aspect-ratio:4/5}
.mosaic img{width:100%;height:100%;object-fit:cover;object-position:50% 35%}
@media (max-width:880px){.hero-g{grid-template-columns:1fr}.lede{max-width:44ch}}

/* sections */
.sec{padding:clamp(56px,7vw,104px) 0}
.sec.tight{padding-top:0}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;margin-bottom:28px}
.shead h2{font-size:clamp(42px,5vw,68px)}
.shead p{color:var(--ink-2);margin:12px 0 0;max-width:50ch}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:40px 22px;padding:28px 0 16px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.card-media{position:relative;aspect-ratio:3/4;background:var(--surface);border-radius:4px;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover}
.card-media::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ca);transition:height .2s ease;z-index:2}
.card:hover .card-media::after,.card:focus-visible .card-media::after{height:6px}
.card.sold img{filter:saturate(.8) brightness(.94)}
.badge{position:absolute;left:10px;top:10px;z-index:3;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:rgba(24,12,26,.78);color:#F3E8D8}
.card-body{display:flex;flex-direction:column;gap:2px;padding-top:12px}
.card-cw{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--cb);box-shadow:inset 0 0 0 2px var(--ca),0 0 0 1px var(--line)}
.card-title{font-size:17.5px;font-weight:700;line-height:1.3;margin-top:2px}
.card:hover .card-title{text-decoration:underline;text-decoration-color:var(--ca);text-decoration-thickness:2px;text-underline-offset:4px}
.card-meta{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--ink-2)}
.card-meta b{color:var(--ink)}

/* image fallback: shows the piece name on its colorway when a photo can't load */
[data-ph]{position:relative}
.img-missing::before{content:attr(data-ph);position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;font-family:var(--display);font-size:clamp(20px,2vw,26px);line-height:1.05;color:var(--ci,var(--ink-2));background:var(--cb,var(--surface)) repeating-linear-gradient(135deg,transparent 0 12px,rgba(255,255,255,.05) 12px 24px);z-index:1}

/* rail */
.rail-btns{display:flex;gap:8px}
.rbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center}
.rbtn:hover{border-color:var(--ink)}
.rbtn svg{width:18px;height:18px}
.scroller{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(200px,21vw,255px);gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);padding:4px var(--gut) 18px;margin-inline:calc(var(--gut) * -1);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.scroller>*{scroll-snap-align:start}

/* the leather library */
.library{display:flex;gap:6px;height:clamp(420px,58vh,540px)}
.spine{position:relative;flex:1 1 0;min-width:0;border-radius:4px;overflow:hidden;text-decoration:none;color:var(--si);background-color:var(--sb);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px),radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.6px);background-size:7px 7px,9px 9px;background-position:0 0,3px 4px;transition:flex-grow .55s cubic-bezier(.2,.7,.2,1)}
.spine::after{content:"";position:absolute;inset:8px;border:1.5px dashed color-mix(in srgb,var(--si) 42%,transparent);border-radius:2px;pointer-events:none;z-index:4}
.spine-name{position:absolute;left:50%;top:26px;transform:translateX(-50%);writing-mode:vertical-rl;font-family:var(--display);font-size:29px;font-weight:600;line-height:1;white-space:nowrap;transition:opacity .25s;z-index:3}
.spine-count{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;font-weight:700;transition:opacity .25s;z-index:3}
.spine-open{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;padding:34px;opacity:0;transition:opacity .35s .1s;isolation:isolate;pointer-events:none}
.spine-img{position:absolute;inset:0;z-index:-2}
.spine-img img{width:100%;height:100%;object-fit:cover}
.spine-open::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 22%,color-mix(in srgb,var(--sb) 72%,transparent) 55%,var(--sb) 86%)}
.spine-copy{display:flex;flex-direction:column;gap:10px;width:min(440px,100%)}
.spine-copy b{font-family:var(--display);font-weight:600;font-size:clamp(40px,4vw,58px);line-height:.95}
.spine-copy span{font-size:16px;line-height:1.5}
.spine-copy em{font-style:normal;font-weight:700;text-decoration:underline;text-decoration-color:var(--sa);text-decoration-thickness:2px;text-underline-offset:5px}
.spine.is-open{flex-grow:8}
.spine.is-open .spine-name,.spine.is-open .spine-count{opacity:0}
.spine.is-open .spine-open{opacity:1;pointer-events:auto}
@media (max-width:760px){
  .library{flex-direction:column;height:auto;gap:8px}
  .spine{flex:none;height:78px}
  .spine.is-open{flex-grow:0}
  .spine-name{writing-mode:horizontal-tb;left:22px;top:50%;transform:translateY(-50%);font-size:27px}
  .spine-count{left:auto;right:24px;bottom:auto;top:50%;transform:translateY(-50%)}
  .spine-open{display:none}
  .spine.is-open .spine-name,.spine.is-open .spine-count{opacity:1}
}

/* shop by piece, with hang tags */
.pieces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(190px,19vw,250px);gap:14px}
.piece{position:relative;display:block;border-radius:4px;overflow:hidden;background:var(--surface);text-decoration:none;color:var(--ink);isolation:isolate}
.piece img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.piece.big{grid-column:span 2;grid-row:span 2}
.piece.tall{grid-row:span 2}
.piece.wide{grid-column:span 2}
.piece.plain{background:var(--velvet-3) radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px) 0 0/7px 7px}
.piece-copy{position:absolute;top:22px;left:22px;right:22px;font-size:16px;color:var(--ink-2);max-width:28ch}
.htag{position:absolute;left:14px;bottom:16px;display:flex;flex-direction:column;background:#F3E8D8;color:#2A1630;padding:9px 18px 10px 34px;clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);transform:rotate(-2.5deg);transform-origin:0 50%;line-height:1.1;transition:transform .35s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.htag::before{content:"";position:absolute;left:13px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#2A1630}
.htag b{font-family:var(--display);font-weight:600;font-size:27px}
.htag small{font-size:13.5px;font-weight:700;opacity:.72;margin-top:3px}
.piece:hover .htag,.piece:focus-visible .htag{transform:rotate(1.5deg)}

/* fit band */
.fit{background:var(--surface)}
.fit-g{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,5vw,72px);align-items:center}
.fit h2{font-size:clamp(46px,5.8vw,84px);line-height:.9}
.fit-copy{font-size:18px;max-width:52ch;margin:26px 0 30px;color:var(--ink-2)}
.fit-ph{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.fit-ph figure{margin:0}
.fit-ph figure:last-child{margin-top:64px}
.fr{aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:var(--bg)}
.fr img{width:100%;height:100%;object-fit:cover}
figcaption{font-size:14.5px;color:var(--ink-2);margin-top:10px;line-height:1.45}
@media (max-width:880px){.fit-g{grid-template-columns:1fr}}

/* lookbook teaser */
.lbt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.lbt a{display:block;border-radius:4px;overflow:hidden;background:var(--surface);aspect-ratio:3/4}
.lbt a:nth-child(even){margin-top:44px}
.lbt img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.lbt{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:58%;overflow-x:auto;padding-bottom:10px}.lbt a:nth-child(even){margin-top:0}}

/* custom teaser */
.cust-g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,5vw,72px);align-items:center}
.cust-ph{aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--surface)}
.cust-ph img{width:100%;height:100%;object-fit:cover}
.cust h2{font-size:clamp(42px,5vw,70px);line-height:.92}
.cust p{font-size:18px;color:var(--ink-2);max-width:46ch;margin:22px 0 28px}
@media (max-width:880px){.cust-g{grid-template-columns:1fr}.cust-ph{max-width:520px}}

/* letter */
.letter{max-width:780px;border:1px solid var(--line);border-radius:14px;padding:clamp(22px,4vw,44px);background:var(--surface)}
.letter summary{cursor:pointer;list-style:none}
.letter summary::-webkit-details-marker{display:none}
.letter .from{color:var(--ink-2);font-weight:700;font-size:15px;margin:0}
.letter h3{font-size:clamp(36px,4vw,52px);margin:8px 0 14px}
.letter .more{display:inline-block;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.letter[open] .more{display:none}
.letter-body{margin-top:18px;font-size:17.5px}
.sig{font-family:var(--display);font-size:30px;line-height:1.1;margin-top:10px}

/* footer */
.foot{border-top:1px solid var(--line);margin-top:32px;padding:64px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.foot-g{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:36px}
.foot h4{font-family:var(--text);font-size:15px;font-weight:700;color:var(--ink-2);margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0}
.foot li a{display:inline-flex;align-items:center;gap:9px;padding:4px 0;text-decoration:none}
.foot li a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.foot .sw{width:14px;height:14px;box-shadow:inset 0 0 0 2px var(--a),0 0 0 1px var(--line)}
.fbrand{font-family:var(--display);font-size:40px;line-height:1;margin:0 0 14px}
.news p{color:var(--ink-2);font-size:15.5px;max-width:38ch}
.news form{display:flex;gap:8px;margin-top:14px;max-width:420px}
.news input{flex:1;min-width:0;height:50px;border-radius:8px;border:1.5px solid var(--line);background:var(--wash);padding:0 14px}
.news input:focus{outline:none;border-color:var(--accent)}
.social{display:flex;gap:14px;margin-top:18px}
.social a{font-weight:700}
.fbase{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.fbase nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.fbase a{text-decoration:none}
.fbase a:hover{text-decoration:underline}
@media (max-width:900px){.foot-g{grid-template-columns:1fr 1fr}.foot-g>:first-child{grid-column:1/-1}}

/* listing pages */
.crumbs{font-size:14.5px;color:var(--ink-2);padding-top:26px}
.crumbs a{text-decoration:none;font-weight:700;color:var(--ink)}
.crumbs a:hover{text-decoration:underline}
.cat-hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,64px);padding:22px 0 44px;align-items:start}
.cat-hero h1{font-size:clamp(58px,8vw,116px);line-height:.86}
.facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:22px 0 24px}
.facts li{border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14.5px;font-weight:700}
.cat-copy{max-width:62ch;color:var(--ink-2)}
.cat-copy a{color:var(--ink);font-weight:700;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.cat-copy strong{color:var(--ink)}
.cat-copy.clamp{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.cat-copy.clamp.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.more-btn{border:0;background:none;padding:6px 0;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.cat-photo{margin:0;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--surface)}
.cat-photo img{width:100%;height:100%;object-fit:cover}
.pattern-fill{height:100%;display:grid;place-items:center;background:var(--velvet-3) radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.6px) 0 0/7px 7px}
.pattern-fill span{font-family:var(--display);font-size:clamp(48px,6vw,84px);writing-mode:vertical-rl;color:var(--accent)}
@media (max-width:880px){.cat-hero{grid-template-columns:1fr}.cat-photo{aspect-ratio:16/11}}
.toolbar{position:sticky;top:var(--hdr);z-index:30;background:var(--bg);border-block:1px solid var(--line);transition:background-color .6s}
.tb-in{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 380px;min-width:0}
@media (max-width:760px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;flex-basis:100%}}
.chip{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14.5px;font-weight:700;background:none;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:14px;height:14px;box-shadow:inset 0 0 0 2px var(--a)}
.tb-right{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.sel{height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-weight:700;font-size:14.5px}
.count{color:var(--ink-2);font-size:14.5px}
.nores{grid-column:1/-1;padding:40px 0}
.empty{padding:36px 0 12px}
.empty-box{border:1.5px dashed var(--line);border-radius:14px;padding:clamp(24px,4vw,44px);max-width:760px}
.empty-box h2{font-size:clamp(34px,4vw,50px);margin-bottom:12px}
.empty-box p{color:var(--ink-2);max-width:54ch}
.also{padding:64px 0 24px}
.also h2{font-size:clamp(32px,3.6vw,44px);margin-bottom:16px}
.also-links{display:flex;flex-wrap:wrap;gap:8px}

/* colorway pages */
.cw-hero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(28px,5vw,72px);padding:22px 0 48px;align-items:start}
.cw-hero h1{font-size:clamp(66px,10.5vw,156px);line-height:.84}
.cw-story{font-size:18px;max-width:58ch;margin-top:26px}
.cw-mix{font-weight:700;margin-top:18px;max-width:58ch}
.cw-cover{margin:0;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:var(--surface)}
.cw-cover img{width:100%;height:100%;object-fit:cover}
.cw-cover.swatch-cover{display:grid;place-items:center;background:var(--surface) radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.6px) 0 0/7px 7px;position:relative}
.cw-cover.swatch-cover::after{content:"";position:absolute;inset:10px;border:1.5px dashed color-mix(in srgb,var(--ink) 38%,transparent);border-radius:2px}
.cw-cover.swatch-cover span{font-family:var(--display);font-size:clamp(56px,7vw,96px);writing-mode:vertical-rl;color:var(--accent)}
@media (max-width:880px){.cw-hero{grid-template-columns:1fr}.cw-cover{aspect-ratio:4/3}}
.others{padding:72px 0 24px}
.others h2{font-size:clamp(32px,3.6vw,44px);margin-bottom:18px}
.others-row{display:flex;flex-wrap:wrap;gap:8px}
.ochip{display:inline-flex;align-items:center;padding:10px 18px;border-radius:999px;background:var(--c);color:var(--i);font-weight:700;text-decoration:none;box-shadow:inset 0 0 0 2px var(--a),0 0 0 1px var(--line)}
.ochip:hover{transform:translateY(-2px)}
.cw-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:40px 0 16px}
.cwcard{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:6px;background:var(--c);color:var(--i);text-decoration:none;min-height:190px;position:relative}
.cwcard::after{content:"";position:absolute;inset:7px;border:1.5px dashed color-mix(in srgb,var(--i) 35%,transparent);border-radius:3px;pointer-events:none}
.cwcard b{font-family:var(--display);font-weight:600;font-size:36px;line-height:1}
.cwcard span{font-size:15.5px;line-height:1.5;opacity:.9}
.cwcard em{margin-top:auto;font-style:normal;font-weight:700;font-size:14.5px}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,4.5vw,72px);padding:22px 0 56px;align-items:start}
.gmain{aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:var(--surface)}
.gmain img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{width:74px;aspect-ratio:3/4;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-current="true"]{border-color:var(--accent)}
.gnote{font-size:14.5px;color:var(--ink-2);margin-top:10px}
.pinfo{position:sticky;top:calc(var(--hdr) + 20px)}
.cwtag{display:inline-flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;font-size:15px}
.cwtag:hover{text-decoration:underline}
.cwtag .sw{width:18px;height:18px}
.pinfo h1{font-size:clamp(46px,5vw,72px);line-height:.9;margin:14px 0 18px}
.pprice{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ptag{position:relative;display:inline-flex;align-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-size:21px;padding:6px 18px 6px 32px;clip-path:polygon(15px 0,100% 0,100% 100%,15px 100%,0 50%)}
.ptag::before{content:"";position:absolute;left:12px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--bg)}
.avail{font-weight:700;color:var(--ink-2)}
.avail.ok{color:var(--ink)}
.avail.ok::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.pstory{color:var(--ink-2);margin:0 0 22px}
.pstory a{color:var(--ink);font-weight:700;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.opt{margin:0 0 20px}
.opt-l{font-weight:700;margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:14.5px;color:var(--ink-2);margin:8px 0 0}
.hint a{color:var(--ink);font-weight:700}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:54px;height:46px;border:1.5px solid var(--line);border-radius:8px;background:none;font-weight:700}
.size[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.size:disabled{opacity:.5;cursor:not-allowed;text-decoration:line-through}
.soldnote{color:var(--ink-2);margin:0 0 14px}
.acc{margin-top:28px;border-bottom:1px solid var(--line)}
.acc details{border-top:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-weight:700;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.pm{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:transform .25s}
.pm svg{width:12px;height:12px}
details[open]>summary .pm{transform:rotate(45deg)}
.acc-b{padding:0 0 18px;color:var(--ink-2);font-size:16px}
.acc-b a{color:var(--ink);font-weight:700}
.acc-b ul{margin:0;padding-left:1.2em}
.ext{display:inline-block;margin-top:18px;font-size:14.5px;color:var(--ink-2)}
.pairs{margin:22px 0 0;padding:16px 18px;border-radius:10px;background:var(--surface);font-size:15.5px}
.pairs p{margin:0 0 6px}
@media (max-width:880px){.pdp{grid-template-columns:1fr}.pinfo{position:static}}
.related{padding:24px 0 16px;border-top:1px solid var(--line)}
.related h2{font-size:clamp(34px,4vw,50px);padding-top:40px}

/* content pages */
.phead{padding:clamp(20px,4vw,44px) 0 clamp(20px,3vw,32px)}
.phead h1{font-size:clamp(60px,8.4vw,120px);line-height:.86}
.phead p{font-size:19px;color:var(--ink-2);max-width:58ch;margin-top:20px}
.prose{max-width:68ch;font-size:17.5px}
.prose h2{font-size:clamp(36px,4.2vw,52px);margin:56px 0 16px}
.prose h2:first-child{margin-top:8px}
.prose h3{font-family:var(--text);font-weight:700;font-size:19px;letter-spacing:0;line-height:1.35;margin:30px 0 8px}
.prose ul{padding-left:1.25em}
.prose li{margin:.45em 0}
.prose li::marker{color:var(--accent)}
.prose a{font-weight:700;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.callout{border-left:4px solid var(--accent);background:var(--surface);padding:18px 22px;border-radius:0 12px 12px 0;margin:26px 0}
.callout p:last-child{margin:0}
.twocol{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,80px);align-items:start;padding-bottom:40px}
.stack{display:grid;gap:14px;position:sticky;top:calc(var(--hdr) + 20px)}
.stack figure{margin:0}
.stack .fr{aspect-ratio:4/5}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:4px 0 28px}

    'I’d love to invite you to take a look around at the collections we have available online, but at present, well... we’re weathering a bit of a storm.',
    'The night of July 3rd, our truck was stolen from in front of our apartment. Win was planning to leave early the morning of the fourth for our next show (Bristol Ren Faire in Kenosha, Wisconsin) so that particular night, not only did thieves take our means of getting to the show, but also the merchandise produced by months of work from the entire shop, our garb, Win’s tools, so many of the trappings of our livelihood.',
    'We’re heartbroken.',
    'But we’re also products of the Theatre Kid to Ren Faire Pipeline and the show must go on.',
    'The offers of help have been incredible, and we’re gonna take y’all up on it, but for right now, please bear with us while we rearrange everything and figure all of this out.',
    'We will be open as usual at our booth at Bristol this weekend and while it’s not the collections we’d hoped to display, we still have lots of gorgeous things to try on or take home, and we’ll be doing our best to get things online as well, but for the moment, we need to focus on production.',
    'Stay tuned for more ways to help (yes, the GoFundMe is coming) and take care out there.'
  ]
};

const PM = {}; P.forEach(p => { PM[p.h] = p; });
const LOOK = D.look.map(x => Object.assign({}, x, { img: I(x.i) }));
const LK = {}; LOOK.forEach(x => { LK[x.i.split('.')[0]] = x; });
const inCw = h => P.filter(p => p.c === h);
const inType = t => P.filter(p => p.t === t);
const SHOULDER = { 'Small': '11″ to 13″', 'Medium': '14″ to 16″', 'Large': '16″ to 19″', 'Extra Large': '18″ to 21″' };

function shortName(p){
  if (p.name) return p.name;
  const one = TY[p.t].one;
  if (p.t === 'pocket-holsters') return one + ' ' + p.z + (p.l ? ' ' + p.l : '');
  return one + (p.l ? ' ' + p.l : '');
}
function fullName(p){ return p.name || (CW[p.c].name + ' ' + shortName(p)); }
function metaLine(p){ return p.t === 'regal-belts' ? 'Sized to order' : p.t === 'ruff-tops' ? 'Six sizes' : ''; }
function availText(p){
  if (!p.stock) return 'Sold out';
  if (p.t === 'regal-belts') return 'Available, sized to order';
  if (p.t === 'accessories') return 'Made to order';
  return 'Available, ready to ship';
}
function article(w){ return /^[AEIOU]/i.test(w) ? 'an' : 'a'; }
function mix(items){
  const parts = [];
  TORDER.forEach(t => {
    const n = items.filter(p => p.t === t).length;
    if (!n) return;
    parts.push(n === 1 ? article(TY[t].one) + ' ' + TY[t].one : n + ' ' + TY[t].name);
  });
  if (!parts.length) return '';
  const s = parts.length === 1 ? parts[0] : parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}
function first(s){ const m = String(s).match(/^[\s\S]*?[.!?](?=\s|$)/); return m ? m[0] : String(s); }
function blurb(c){
  if (c.blurb) return c.blurb;
  if (c.story) return first(c.story[0]);
  const items = inCw(c.h);
  return items.length ? mix(items) : 'Nothing online right now. Ask about a custom in this colorway.';
}
function countWord(n){ return n ? n + ' ' + plural(n, 'piece') + ' online' : 'Custom orders only'; }

/* ---------- theme: colorway pages repaint the whole site ---------- */
const TK = [['--bg','bg'],['--surface','surface'],['--ink','ink'],['--ink-2','ink2'],['--accent','accent'],['--on-accent','on']];
function setTheme(c){
  const s = document.documentElement.style;
  TK.forEach(([k, f]) => { if (c) s.setProperty(k, c[f]); else s.removeProperty(k); });
  const m = $('meta[name="theme-color"]');
  if (m) m.setAttribute('content', c ? c.bg : '#2A1630');
}

/* ---------- shared pieces ---------- */
function cwVars(c){ return c ? '--cb:' + c.bg + ';--ci:' + c.ink + ';--ca:' + c.accent : '--cb:var(--surface);--ci:var(--ink-2);--ca:var(--accent)'; }
function card(p, sizes){
  const c = p.c ? CW[p.c] : null;
  const img = p.imgs[0];
  const nm = fullName(p);
  const m = metaLine(p);
  return `<a class="card${p.stock ? '' : ' sold'}" href="#/products/${p.h}" style="${cwVars(c)}">
    <div class="card-media${img ? '' : ' img-missing'}" data-ph="${esc(nm)}">${img ? pic(img, { alt: nm, sizes: sizes || '(max-width:560px) 50vw, (max-width:1100px) 30vw, 260px', w: [360, 540, 720, 1000] }) : ''}${p.stock ? '' : '<span class="badge">Sold out</span>'}</div>
    <div class="card-body">${c ? `<span class="card-cw"><i class="dot"></i>${esc(c.name)}</span>` : ''}<span class="card-title">${esc(shortName(p))}</span><span class="card-meta"><b>${money(p.price)}</b>${m ? `<span>${esc(m)}</span>` : ''}</span></div>
  </a>`;
}
function crumbs(parts){
  return '<nav class="crumbs" aria-label="Breadcrumb">' + parts.map(x => Array.isArray(x) ? `<a href="${x[0]}">${esc(x[1])}</a>` : `<span aria-current="page">${esc(x)}</span>`).join(' / ') + '</nav>';

const TRIDENT_SVG = '<svg viewBox="0 0 20 34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 33V9"/><path d="M3 4v6a7 7 0 0 0 14 0V4"/><path d="M10 2v11"/><path d="M1.5 6 3 4l1.5 2M15.5 6 17 4l1.5 2M8.5 4 10 2l1.5 2"/><path d="M7.5 26.5h5"/></svg>';
let REVEAL = null;
const DEFAULT_OPEN = 'forty-fathoms';
function spine(c){

  return `<a class="spine${c.h === DEFAULT_OPEN ? ' is-open' : ''}" href="#/collections/${c.h}" style="--sb:${c.bg};--si:${c.ink};--sa:${c.accent}" aria-label="${esc(c.name)}: ${esc(countWord(n))}">

  </a>`;
}
function library(){ return `<div class="library">${COLS.map(spine).join('')}</div>`; }
function bindLibrary(){
  const lib = $('.library', main);
  if (!lib) return;
  const mq = matchMedia('(min-width: 761px)');
  let t = null;
  const open = s => { if (!mq.matches) return; $$('.spine', lib).forEach(x => x.classList.toggle('is-open', x === s)); };
  lib.addEventListener('mouseover', e => {
    const s = e.target.closest('.spine');
    if (!s || s.classList.contains('is-open')) return;
    clearTimeout(t);
    t = setTimeout(() => open(s), 130);
  });
  lib.addEventListener('mouseleave', () => clearTimeout(t));
  lib.addEventListener('focusin', e => { const s = e.target.closest('.spine'); if (s) open(s); });
}

/* ---------- filters ---------- */
const newState = () => ({ cw: new Set(), type: new Set(), avail: false, size: '', sort: 'featured' });
function toolbar(o){
  let chips = '';
  if (o.types && o.types.length > 1) chips += o.types.map(t => `<button class="chip" type="button" data-f="type:${t}" aria-pressed="false">${esc(TY[t].name)}</button>`).join('');
  if (o.cws && o.cws.length > 1) chips += o.cws.map(c => `<button class="chip" type="button" data-f="cw:${c.h}" aria-pressed="false"><i class="sw" style="--c:${c.bg};--a:${c.accent}"></i>${esc(c.name)}</button>`).join('');
  if (o.sizes) chips += o.sizes.map(s => `<button class="chip" type="button" data-f="size:${s}" aria-pressed="false">${s}</button>`).join('');
  return `<div class="chips" role="group" aria-label="Filters">${chips}</div>
  <div class="tb-right">
    ${o.cwSelect ? `<label><span class="sr">Colorway</span><select class="sel" data-cwsel><option value="">All colorways</option>${o.cwSelect.map(c => `<option value="${c.h}">${esc(c.name)}</option>`).join('')}</select></label>` : ''}
    ${o.avail ? '<label class="switch"><input type="checkbox" data-avail> Available now</label>' : ''}
    <label><span class="sr">Sort by</span><select class="sel" data-sort><option value="featured">Featured</option><option value="price-asc">Price, low to high</option><option value="price-desc">Price, high to low</option><option value="az">Name, A to Z</option></select></label>
    <span class="count" id="count" aria-live="polite"></span>
  </div>`;
}
function filterSort(items, st){
  const r = items.filter(p => (!st.cw.size || st.cw.has(p.c)) && (!st.type.size || st.type.has(p.t)) && (!st.avail || p.stock) && (!st.size || p.z === st.size));
  const oi = h => { const i = ORDER.indexOf(h); return i < 0 ? 99 : i; };
  if (st.sort === 'featured') r.sort((a, b) => (b.stock - a.stock) || (oi(a.c) - oi(b.c)) || (a.i - b.i));
  else if (st.sort === 'price-asc') r.sort((a, b) => (a.price - b.price) || (b.stock - a.stock) || (a.i - b.i));
  else if (st.sort === 'price-desc') r.sort((a, b) => (b.price - a.price) || (b.stock - a.stock) || (a.i - b.i));
  else if (st.sort === 'az') r.sort((a, b) => fullName(a).localeCompare(fullName(b)));
  return r;
}
function bindFilters(items, st){
  const tb = $('.toolbar', main), grid = $('#grid'), count = $('#count');
  if (!grid) return;
  const draw = () => {
    const r = filterSort(items, st);
    grid.innerHTML = r.length ? r.map(p => card(p)).join('') : '<div class="nores"><p>Nothing matches those filters.</p><button class="btn btn-g" type="button" data-clear>Clear filters</button></div>';
    if (count) count.textContent = r.length + ' ' + plural(r.length, 'piece');
  };
  if (tb){
    tb.addEventListener('click', e => {
      const b = e.target.closest('[data-f]');
      if (!b) return;
      const f = b.dataset.f, k = f.slice(0, f.indexOf(':')), v = f.slice(f.indexOf(':') + 1);
      if (k === 'size'){
        st.size = st.size === v ? '' : v;
        $$('[data-f^="size:"]', tb).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f === 'size:' + st.size)));
      } else {
        const set = st[k];
        if (set.has(v)) set.delete(v); else set.add(v);
        b.setAttribute('aria-pressed', String(set.has(v)));
      }
      draw();
    });
    tb.addEventListener('change', e => {
      const t = e.target;
      if (t.matches('[data-avail]')) st.avail = t.checked;
      else if (t.matches('[data-sort]')) st.sort = t.value;
      else if (t.matches('[data-cwsel]')) st.cw = new Set(t.value ? [t.value] : []);
      draw();
    });
  }
  grid.addEventListener('click', e => {
    if (!e.target.closest('[data-clear]')) return;
    st.cw.clear(); st.type.clear(); st.size = ''; st.avail = false;
    if (tb){
      $$('[data-f]', tb).forEach(x => x.setAttribute('aria-pressed', 'false'));
      $$('input[data-avail]', tb).forEach(x => { x.checked = false; });
      $$('select[data-cwsel]', tb).forEach(x => { x.value = ''; });
    }
    draw();
  });
  draw();
}

function bindProduct(p){
  const g = $('#gmain');
  $$('.thumb').forEach(b => b.addEventListener('click', () => {
    const im = p.imgs[+b.dataset.i];
    g.classList.remove('img-missing');
    g.innerHTML = pic(im, { alt: fullName(p), sizes: '(max-width:880px) 100vw, 680px', w: [540, 720, 1000, 1400, 1800] });
    $$('.thumb').forEach(x => x.setAttribute('aria-current', String(x === b)));
  }));
  let size = '';
  $$('.size').forEach(b => b.addEventListener('click', () => {
    size = b.dataset.size;
    $$('.size').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const add = $('#addBtn');
  if (add) add.addEventListener('click', () => {
    let note = '';
    if (p.t === 'regal-belts'){
      const w = $('#mw').value.trim(), h = $('#mh').value.trim();
      note = (w || h) ? 'Waist ' + (w || '?') + '″, hips ' + (h || '?') + '″' : 'Measurements to follow';
    }
    if (p.t === 'pocket-holsters') note = 'Size ' + p.z;
    if (p.t === 'ruff-tops'){ if (!size){ toast('Pick a ruff length first'); return; } note = 'Length ' + size; }
    if (p.t === 'accessories'){ const v = $('#anote').value.trim(); note = v ? 'For: ' + v : ''; }
    addToCart(p.h, note);
  });
}

    </div>
    <section class="tpanel prose" role="tabpanel" id="p-belt" aria-labelledby="t-belt">
      <p>Our extra small and small belts have shorter tongues than our medium, long, and extra long. If you are shopping for a Ren Faire or LARPing look and tend to wear a bodice or corset, we recommend prioritizing your waist measurement.</p>
      <p>If you don’t wear a bodice or are shopping for everyday wear, you may want to prioritize your hip measurement. We encourage choosing a size that can accommodate both waist and hips to give you the most versatility in styling if possible.</p>
      <p><strong>We offer free resizing on all of our belts for life</strong> because leather is built to last and bodies change over time. If you need your belt resized, email us at <a href="mailto:${EMAIL}">${EMAIL}</a> or bring it to our booth at any of our events. Resizing is free (and always will be), but we can’t cover the cost of shipping your belt to or from the studio.</p>

    <section class="tpanel" role="tabpanel" id="p-hol" aria-labelledby="t-hol" hidden>
      <div class="prose">
        <p>We make four sizes of holster, each of which has three settings, so we can accommodate 12 shoulder widths within our standard sizing. Please note that our smalls are <em>very</em> small (think jockey sized). Medium and Large are by far our most popular sizes, and our XL is a relatively new addition to our lineup.</p>
        <p>Two measurements matter: the distance across your shoulders and the height of the pockets. The distance across the shoulders should determine the size holster you need for your body, while the height of the pockets is more about personal preference. If you prefer the pocket height of a different size, just make a note of it in your order and we’ll be in touch about how best to achieve your desired fit.</p>
        <div class="callout"><p><strong>Please note that our holsters are not resizable the way the belts are!</strong> That being said, we do hybrid sizes for custom orders, we can add extra snaps to an existing set of shoulders to make them fit a more narrow size, and we offer the pockets or shoulders separately as custom orders.</p></div>
        <p>All measurements below are approximate. We recommend measuring straight across your shoulders from top of curve to top of curve and using the “Across shoulder” measurement if you’re unsure. Ranges go from the smallest setting on the adjustable back snaps to the largest. You can also watch how our holsters are designed to fit on Instagram, <a href="https://www.instagram.com/reel/C8u7iPAyXnO/" target="_blank" rel="noopener">here</a> and <a href="https://www.instagram.com/reel/C8vLDgVyoUh/" target="_blank" rel="noopener">here</a>.</p>
      </div>
      ${table(['Small', 'Medium', 'Large', 'Extra Large'], holRows)}
    </section>
    <section class="tpanel" role="tabpanel" id="p-ruff" aria-labelledby="t-ruff" hidden>
      <div class="prose">
        <p>The best way to understand our ruff top sizing is to watch this <a href="https://www.instagram.com/reel/DA9vX6ySrGN/" target="_blank" rel="noopener">quick video on Instagram</a>.</p>
        <p>We make six sizes of ruff tops off the rack: 37, 38, 39, 41, 43, and 46. These sizes refer to the length of the ruff itself, and do not correspond to any “standard” sizing systems that we’re aware of. If you haven’t had a chance to try on a ruff top in person, we highly recommend taking the time to measure yourself with a tape measure.</p>
        <p>Two measurements matter. The first is the length of the ruff. Rather than simply looking at the chart to see how small of a ruff you might fit into, use a tape measure to “try on” several sizes and see where you’d like the ruff to hit on your body.</p>
        <p>The second is the length of the straps that go around the rib cage. The ranges below include the adjustability of the included snaps. If you need longer straps, simply add ruff extenders to your order, include the measurement needed in the order comments, and we’ll make a matching set. (Yes, you can order extenders for a ruff you already have, we just need to know the color of the straps and snaps!)</p>
        <div class="callout"><p><strong>Example:</strong> This person’s center nape to just under the bust measurement is 18.5″. Add 3″ for the second snap strap and the measurement equals 21.5″. Double that and you get 43″, so this person wears a 43 Ruff Top. In between sizes or unsure? <a href="#/pages/contact">Contact us</a> and we can help!</p></div>
      </div>
      ${table(['37', '38', '39', '41', '43', '46'], ruffRows)}
    </section></div>`,
    mount(){
      const tabs = $$('[role="tab"]', main);
      const sel = i => tabs.forEach((x, j) => {
        x.setAttribute('aria-selected', String(i === j));
        x.tabIndex = i === j ? 0 : -1;
        document.getElementById(x.getAttribute('aria-controls')).hidden = i !== j;
      });
      tabs.forEach((tb, i) => {
        tb.addEventListener('click', () => sel(i));
        tb.addEventListener('keydown', e => {
          if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
          e.preventDefault();
          const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
          sel(n); tabs[n].focus();
        });
      });
    }
  };
}
function pCare(){

    <header class="phead"><h1>Care &amp; feeding</h1><p>All of our creations are made with adventure-ready garment leather and can benefit from the same care as a leather jacket. The natural patina of wear adds beauty and personality, but a little cleaning and care will keep them looking their best for years to come.</p></header>

    <a class="pfeat" href="#/collections/regal-belts">${pic(LK.Kat1.img, { alt: '', sizes: '230px', w: [360, 540] })}<span>Free resizing on every Regal Belt, for life.</span></a></div></li>
  <li><button class="mbtn" type="button" data-menu="cw" aria-expanded="false">Collections ${ICON.chev}</button>
    <div class="panel panel-cw">${COLS.map(c => { const n = inCw(c.h).length; return `<a class="cwlink" href="#/collections/${c.h}"><i class="sw" style="--c:${c.bg};--a:${c.accent}"></i>${esc(c.name)}<small>${n || ''}</small></a>`; }).join('')}<a class="cwlink all" href="#/collections">See all collections</a></div></li>
  <li><a class="mbtn" href="#/pages/lookbook" data-sec="lookbook">Lookbook</a></li>
  <li><a class="mbtn" href="#/pages/custom-orders" data-sec="custom">Custom orders</a></li>
  <li><button class="mbtn" type="button" data-menu="about" aria-expanded="false">About ${ICON.chev}</button>
    <div class="panel panel-about">${ABOUT.map(([h, t]) => `<a href="#/pages/${h}">${t}</a>`).join('')}</div></li>`;
}
function buildMobile(){
  $('#mnav').innerHTML = `<div class="mnav-top"><a class="brand" href="#/">Krakenwhip</a><button class="ibtn" type="button" id="mnavClose" aria-label="Close menu">${ICON.close}</button></div>
  <details><summary>Shop ${ICON.plus}</summary><div class="mlinks">${TORDER.map(t => `<a href="#/collections/${t}">${esc(TY[t].name)}</a>`).join('')}<a href="#/collections/all">Shop everything</a></div></details>
  <details><summary>Collections ${ICON.plus}</summary><div class="mlinks">${COLS.map(c => `<a href="#/collections/${c.h}"><i class="sw" style="--c:${c.bg};--a:${c.accent}"></i>${esc(c.name)}</a>`).join('')}<a href="#/collections">See all collections</a></div></details>
  <a class="mtop" href="#/pages/lookbook">Lookbook</a>
  <a class="mtop" href="#/pages/custom-orders">Custom orders</a>
  <details><summary>About ${ICON.plus}</summary><div class="mlinks">${ABOUT.map(([h, t]) => `<a href="#/pages/${h}">${t}</a>`).join('')}</div></details>`;
}
function buildFooter(){
  const pol = [['privacy-policy', 'Privacy policy'], ['refund-policy', 'Refund policy'], ['terms-of-service', 'Terms of service'], ['contact-information', 'Contact information']];
  $('#foot').innerHTML = `<div class="wrap"><div class="foot-g">
    <div class="news" id="newsletter"><p class="fbrand">Krakenwhip</p><p>If I ever manage to build an email list, you can be on it if you want to ¯\\_(ツ)_/¯</p>
      <form id="newsForm"><label class="sr" for="nemail">Email</label><input id="nemail" type="email" placeholder="Email" required autocomplete="email"><button class="btn btn-p" type="submit">Sign me up</button></form>
      <div class="social"><a href="${IG}" target="_blank" rel="noopener">Instagram</a><a href="${FB}" target="_blank" rel="noopener">Facebook</a></div></div>
    <div><h4>Shop</h4><ul>${TORDER.map(t => `<li><a href="#/collections/${t}">${esc(TY[t].name)}</a></li>`).join('')}<li><a href="#/collections/all">Shop everything</a></li></ul></div>
    <div><h4>Collections</h4><ul>${COLS.map(c => `<li><a href="#/collections/${c.h}"><i class="sw" style="--c:${c.bg};--a:${c.accent}"></i>${esc(c.name)}</a></li>`).join('')}</ul></div>
    <div><h4>About</h4><ul>${ABOUT.map(([h, t]) => `<li><a href="#/pages/${h}">${t}</a></li>`).join('')}<li><a href="#/pages/lookbook">Lookbook</a></li><li><a href="#/pages/custom-orders">Custom orders</a></li></ul></div>
  </div>
  <div class="fbase"><span>© 2026 Krakenwhip. Handmade in Oakland, CA.</span><nav aria-label="Policies">${pol.map(([h, t]) => `<a href="https://krakenwhip.com/policies/${h}" target="_blank" rel="noopener">${t}</a>`).join('')}</nav></div></div>`;
  $('#newsForm').addEventListener('submit', e => {
    e.preventDefault();
    const em = $('#nemail');
    if (!em.checkValidity()){ toast('That email address looks incomplete'); em.focus(); return; }
    em.value = '';
    toast('Preview only. Sign-ups will connect to Shopify when this goes live.');
  });
}
function closeMenus(){
  $$('#menu > li.open').forEach(li => li.classList.remove('open'));
  $$('#menu [data-menu]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
function openMobile(){ $('#mnav').classList.add('open'); $('#burger').setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; setTimeout(() => { const b = $('#mnavClose'); if (b) b.focus(); }, 60); }
function closeMobile(){ $('#mnav').classList.remove('open'); $('#burger').setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
function markNav(parts){
  let sec = '';
  if (parts[0] === 'collections') sec = (!parts[1] || CW[parts[1]]) ? 'cw' : 'shop';
  else if (parts[0] === 'products') sec = 'shop';
  else if (parts[0] === 'pages') sec = parts[1] === 'lookbook' ? 'lookbook' : parts[1] === 'custom-orders' ? 'custom' : 'about';
  $$('#menu .mbtn').forEach(b => b.classList.toggle('cur', (b.dataset.menu || b.dataset.sec) === sec));
}

/* ---------- bag ---------- */
let CART = [];
try { CART = JSON.parse(localStorage.getItem('kw-bag') || '[]').filter(x => x && PM[x.h]); } catch (e) { CART = []; }
let lastFocus = null;
function saveCart(){ try { localStorage.setItem('kw-bag', JSON.stringify(CART)); } catch (e) {} }
function addToCart(h, note){
  if (CART.some(x => x.h === h)){ toast('That piece is already in your bag'); openCart(); return; }
  CART.push({ h, note });
  saveCart(); renderCart(); openCart();
}
function renderCart(){
  $('#bagN').textContent = CART.length;
  const body = $('#cartBody'), foot = $('#cartFoot');
  if (!CART.length){
    body.innerHTML = '<p class="fine" style="padding-top:18px">Your bag is empty.</p><a class="btn btn-g wide" href="#/collections/all">Shop everything</a>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = CART.map(x => {
    const p = PM[x.h], c = p.c ? CW[p.c] : null;
    return `<div class="citem" style="${cwVars(c)}"><div class="cthumb${p.imgs[0] ? '' : ' img-missing'}" data-ph="">${p.imgs[0] ? pic(p.imgs[0], { alt: '', sizes: '72px', w: [160, 320] }) : ''}</div><div><a href="#/products/${p.h}">${esc(fullName(p))}</a>${x.note ? `<small>${esc(x.note)}</small>` : ''}<button class="rm" type="button" data-rm="${p.h}">Remove</button></div><b>${money(p.price)}</b></div>`;
  }).join('');
  const sub = CART.reduce((s, x) => s + PM[x.h].price, 0);
  foot.innerHTML = `<div class="subt"><span>Subtotal</span><span>${money(sub)}</span></div><p class="fine">Shipping is calculated at checkout. Orders ship USPS Priority Mail.</p><button class="btn btn-p wide" type="button" id="checkout">Check out</button>`;
}
function openCart(){
  lastFocus = document.activeElement;
  $('#cart').classList.add('open'); $('#cart').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('show');
  setTimeout(() => $('#cartClose').focus(), 60);
}
function closeCart(restore){
  if (!$('#cart').classList.contains('open')) return;
  $('#cart').classList.remove('open'); $('#cart').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('show');
  if (restore !== false && lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- search ---------- */
const PAGE_INDEX = [
  ['#/pages/sizing-chart', 'Sizing guide', 'size sizing measure fit chart waist hips shoulders ruff length holster belt'],
  ['#/pages/custom-orders', 'Custom orders', 'custom consult commission made to order payment plan layaway monarch kintsugi'],
  ['#/pages/shipping', 'Shipping and returns', 'shipping returns exchange usps delivery rush'],
  ['#/pages/care-keeping', 'Care and feeding', 'care clean leather wipe snaps repair resizing'],
  ['#/pages/faq', 'FAQ', 'faq questions vegan leather upcycled storefront black white'],
  ['#/pages/show-schedule', 'Show schedule', 'events faire booth shows schedule bristol ren'],
  ['#/pages/lookbook', 'Lookbook', 'lookbook photos customers crew inspiration'],
  ['#/pages/about', 'About us', 'about history molly win kristin oakland story whole hide'],
  ['#/pages/contact', 'Contact', 'contact email message help']
];
function runSearch(raw){
  const out = $('#sres');
  const q = raw.trim().toLowerCase();
  if (!q){
    out.innerHTML = `<h5>Popular</h5>${['regal-belts', 'pocket-holsters', 'thigh-bags', 'ruff-tops'].map(t => `<a class="sitem" href="#/collections/${t}"><span>${esc(TY[t].name)}<small>${inType(t).length} pieces</small></span></a>`).join('')}<h5>Collections</h5><div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 10px">${COLS.map(c => `<a class="chip" href="#/collections/${c.h}"><i class="sw" style="--c:${c.bg};--a:${c.accent}"></i>${esc(c.name)}</a>`).join('')}</div>`;
    return;
  }
  const toks = q.split(/\s+/).filter(Boolean);
  const hit = s => { s = s.toLowerCase(); return toks.every(k => s.indexOf(k) > -1); };
  const prods = P.filter(p => hit(fullName(p) + ' ' + TY[p.t].name + ' ' + (p.c ? CW[p.c].name : '') + ' ' + p.z)).sort((a, b) => (b.stock - a.stock) || (a.i - b.i));
  const cols = COLS.filter(c => hit(c.name + ' ' + (c.story ? c.story.join(' ') : '')));
  const types = TORDER.filter(t => hit(TY[t].name + ' ' + TY[t].one));
  const pages = PAGE_INDEX.filter(x => hit(x[1] + ' ' + x[2]));
  let h = '';
  if (types.length || cols.length){
    h += '<h5>Categories and collections</h5>' + types.map(t => `<a class="sitem" href="#/collections/${t}"><span>${esc(TY[t].name)}<small>${inType(t).length ? inType(t).length + ' pieces' : 'Custom order only'}</small></span></a>`).join('') + cols.map(c => `<a class="sitem" href="#/collections/${c.h}"><i class="sw" style="--c:${c.bg};--a:${c.accent}"></i><span>${esc(c.name)}<small>${esc(countWord(inCw(c.h).length))}</small></span></a>`).join('');
  }
  if (prods.length){
    h += `<h5>Pieces (${prods.length})</h5>` + prods.slice(0, 10).map(p => `<a class="sitem" href="#/products/${p.h}" style="${cwVars(p.c ? CW[p.c] : null)}"><span class="sthumb${p.imgs[0] ? '' : ' img-missing'}" data-ph="">${p.imgs[0] ? pic(p.imgs[0], { alt: '', sizes: '44px', w: [120, 240] }) : ''}</span><span>${esc(fullName(p))}<small>${money(p.price)}, ${p.stock ? 'available' : 'sold out'}</small></span></a>`).join('') + (prods.length > 10 ? '<a class="sitem" href="#/collections/all"><span>Browse all pieces</span></a>' : '');
  }
  if (pages.length) h += '<h5>Pages</h5>' + pages.map(x => `<a class="sitem" href="${x[0]}"><span>${esc(x[1])}</span></a>`).join('');
  out.innerHTML = h || `<p class="snone">Nothing matches “${esc(raw.trim())}”. Try a colorway like Sepia, or a piece like thigh bag.</p>`;
}
function openSearch(){ lastFocus = document.activeElement; closeMobile(); $('#search').classList.add('open'); const q = $('#q'); q.value = ''; runSearch(''); setTimeout(() => q.focus(), 30); }
function closeSearch(restore){
  if (!$('#search').classList.contains('open')) return;
  $('#search').classList.remove('open');
  if (restore !== false && lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- lookbook lightbox ---------- */
let LBL = [], LBI = 0;
function openLB(list, i){ lastFocus = document.activeElement; LBL = list; LBI = Math.max(0, i); showLB(); $('#lb').classList.add('open'); $('#lbClose').focus(); }
function showLB(){
  const x = LBL[LBI];
  $('#lbImg').innerHTML = pic(x.img, { alt: x.alt, sizes: '90vw', w: [720, 1000, 1400, 1800] });
  $('#lbCap').innerHTML = esc(x.alt) + (x.t ? ` <a href="#/collections/${x.t}">Shop ${esc(TY[x.t].name)}</a>` : '');
}
function stepLB(d){ LBI = (LBI + d + LBL.length) % LBL.length; showLB(); }
function closeLB(restore){
  if (!$('#lb').classList.contains('open')) return;
  $('#lb').classList.remove('open');
  if (restore !== false && lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- toast ---------- */
let tt = null;
function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3000); }

/* ---------- router (URLs mirror the Shopify handles) ---------- */
const main = $('#main');
let pendingScroll = null;
function parseHash(){
  const h = location.hash.replace(/^#/, '');
  if (!h || h === '/') return [];
  return h.split('?')[0].split('/').filter(Boolean);
}
let CURRENT = null, ON_HOME = false;
function updateHdr(){ document.body.classList.toggle('at-hero', ON_HOME && scrollY < 30); }
addEventListener('scroll', updateHdr, { passive: true });
function render(){
  const parts = parseHash();
  if (CURRENT && CURRENT.unmount){ try { CURRENT.unmount(); } catch (err){ console.error(err); } }
  CURRENT = null;
  closeMenus(); closeMobile(); closeCart(false); closeSearch(false); closeLB(false);
  let v;
  try {
    if (!parts.length) v = vHome();
    else if (parts[0] === 'collections'){
      const h = parts[1];
      if (!h) v = vCollections();
      else if (h === 'all') v = vAll();
      else if (TY[h]) v = vType(h);
      else if (CW[h]) v = vCw(h);
      else v = v404();
    }
    else if (parts[0] === 'products'){ const p = PM[parts[1]]; v = p ? vProduct(p) : v404(); }
    else if (parts[0] === 'pages'){ const f = PAGES[parts[1]]; v = f ? f() : v404(); }
    else v = v404();
  } catch (err){ console.error(err); v = v404(); }
  main.innerHTML = v.html;
  setTheme(v.theme || null);
  document.title = v.title ? v.title + ' | Krakenwhip' : 'Krakenwhip: Level Up Your Leather';
  markNav(parts);
  ON_HOME = !parts.length;
  CURRENT = v;
  if (v.mount) v.mount();
  if (pendingScroll){
    const el = document.getElementById(pendingScroll);
    pendingScroll = null;
    if (el){ requestAnimationFrame(() => el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' })); return; }
  }
  window.scrollTo(0, 0);
  updateHdr();
  main.focus({ preventScroll: true });
}
window.addEventListener('hashchange', render);

/* ---------- global events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const mb = t.closest('[data-menu]');
  if (mb){
    const li = mb.parentElement, was = li.classList.contains('open');
    closeMenus();
    if (!was){ li.classList.add('open'); mb.setAttribute('aria-expanded', 'true'); }
    return;
  }
  if (!t.closest('.panel')) closeMenus();
  const sc = t.closest('[data-scroll]');
  if (sc){
    e.preventDefault();
    const id = sc.dataset.scroll, el = document.getElementById(id);
    closeMobile();
    if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    else { pendingScroll = id; location.hash = sc.getAttribute('href') || '#/'; }
    return;
  }
  const ex = t.closest('[data-expand]');
  if (ex){
    const el = document.getElementById(ex.dataset.expand), open = el.classList.toggle('open');
    ex.setAttribute('aria-expanded', String(open));
    ex.textContent = open ? 'Show less' : 'Read more';
    return;
  }
  if (t.closest('[data-open-search]')){ openSearch(); return; }
  const rm = t.closest('[data-rm]');
  if (rm){ CART = CART.filter(x => x.h !== rm.dataset.rm); saveCart(); renderCart(); return; }
  if (t.closest('#checkout')){ toast('Preview only. Checkout hands off to Shopify once this is live.'); return; }
  if (t.closest('#sres a')) closeSearch(false);
});
document.addEventListener('keydown', e => {
  const lbOpen = $('#lb').classList.contains('open');
  if (e.key === 'Escape'){
    if (lbOpen) closeLB();
    else if ($('#search').classList.contains('open')) closeSearch();
    else if ($('#cart').classList.contains('open')) closeCart();
    else if ($('#mnav').classList.contains('open')) closeMobile();
    else closeMenus();
    return;
  }
  if (lbOpen && e.key === 'ArrowRight') stepLB(1);
  if (lbOpen && e.key === 'ArrowLeft') stepLB(-1);
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')){ e.preventDefault(); openSearch(); }
});
$('#burger').addEventListener('click', openMobile);
$('#mnav').addEventListener('click', e => { if (e.target.closest('#mnavClose')) closeMobile(); });
$('#searchBtn').addEventListener('click', openSearch);
$('#searchClose').addEventListener('click', () => closeSearch());
$('#search').addEventListener('click', e => { if (e.target.id === 'search') closeSearch(); });
$('#q').addEventListener('input', e => runSearch(e.target.value));
$('#bagBtn').addEventListener('click', openCart);
$('#cartClose').addEventListener('click', () => closeCart());
$('#scrim').addEventListener('click', () => closeCart());
$('#lbClose').addEventListener('click', () => closeLB());
$('#lbPrev').addEventListener('click', () => stepLB(-1));
$('#lbNext').addEventListener('click', () => stepLB(1));
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLB(); });

/* ---------- start ---------- */
buildNav(); buildMobile(); buildFooter(); renderCart(); render();
})();

</script>
</body>
</html>
